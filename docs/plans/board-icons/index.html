<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board-Icons</title>
<style>
:root { --bg:#f4f5f7; --fg:#1d2330; --muted:#5d6676; --line:#dde1e8; --card:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171d; --fg:#e4e8ef; --muted:#98a2b3; --line:#2b313c; --card:#1b1f27; } }
body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; margin:0; padding:28px 16px; }
main { max-width:760px; margin:0 auto; }
h1 { font-size:22px; margin:0 0 4px; }
p { color:var(--muted); margin:0 0 20px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; gap:12px; align-items:flex-start; }
figcaption { font-size:13px; color:var(--muted); }
figcaption b { color:var(--fg); font-size:14px; }
</style>
</head>
<body>
<main>
<h1>Icons für die IssueBoard-Knöpfe</h1>
<p>Phase 2 des Plans. Linienicons auf dem 24er-Raster, wie die im Band; Trader fragen in Gold.</p>
<div class="grid">
<figure><img src="starten.svg" width="40" height="40" alt="Starten"><figcaption><b>Starten</b><br>Karte in „bereit“: eigene Session mit Branch und PR</figcaption></figure>
<figure><img src="welle.svg" width="40" height="40" alt="Welle starten"><figcaption><b>Welle starten</b><br>Alle bereiten Karten eines Plans, nach Abhängigkeit</figcaption></figure>
<figure><img src="trader-fragen.svg" width="40" height="40" alt="Trader fragen"><figcaption><b>Trader fragen</b><br>Fable als erfahrener Trader: Check des Ganzen und Abnahme-Vorschlag</figcaption></figure>
<figure><img src="fertig.svg" width="40" height="40" alt="Fertig?"><figcaption><b>Fertig?</b><br>Stand prüfen, Reste als Issues, aufräumen</figcaption></figure>
<figure><img src="ueberblick.svg" width="40" height="40" alt="Überblick"><figcaption><b>Überblick</b><br>Günstige Session baut eine HTML-Seite: was lief, was ist offen, was ist zu tun</figcaption></figure>
<figure><img src="plan-gegenpruefen.svg" width="40" height="40" alt="Plan gegenprüfen"><figcaption><b>Plan gegenprüfen</b><br>Frische Session prüft nur den Plan, Befunde landen in der Plan-Datei</figcaption></figure>
</div>
</main>
</body>
</html>
